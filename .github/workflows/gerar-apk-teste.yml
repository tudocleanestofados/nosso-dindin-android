name: Gerar APK Nosso Dindin Teste

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verificar arquivos
        run: |
          test -f package.json
          test -f capacitor.test.config.json
          test -f www/index.html
          test -f icon.png
          test -f google-services.json

      - name: Usar configuracao do APK de teste
        run: cp capacitor.test.config.json capacitor.config.json

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Adicionar Firebase
        run: cp google-services.json android/app/google-services.json

      - name: Preparar icone
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png

      - name: Gerar icones Android
        run: npx @capacitor/assets generate --android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verificar APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Dindin-APK-TESTE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
