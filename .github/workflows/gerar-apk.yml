name: Preparar APK oficial Nosso Dindin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/official-release-trigger'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verificar arquivos do projeto
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f icon.png
          test -f google-services.json
          echo "Arquivos principais encontrados."

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Adicionar configuracao Firebase
        run: cp google-services.json android/app/google-services.json

      - name: Preparar imagem do icone
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png

      - name: Gerar icones Android
        run: npx @capacitor/assets generate --android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Incrementar versao oficial
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          content = path.read_text()
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          content, code_count = re.subn(r'\bversionCode\s+\d+', f'versionCode {1000 + run}', content, count=1)
          content, name_count = re.subn(r'\bversionName\s+"[^"]+"', f'versionName "1.0.{run}"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise RuntimeError('Versao do Android nao encontrada no build.gradle')
          path.write_text(content)
          PY

      - name: Compilar APK de producao sem assinatura
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verificar APK gerado
        run: |
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Dindin-Release-Sem-Assinatura
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
