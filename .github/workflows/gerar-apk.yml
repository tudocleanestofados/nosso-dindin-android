name: Gerar APK Nosso Dindin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verificar arquivos do projeto
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f icon.png
          echo "Arquivos principais encontrados."

      - name: Instalar dependencias
        run: npm install

      - name: Instalar gerador de icones
        run: npm install --save-dev @capacitor/assets

      - name: Preparar imagem do icone
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icones Android
        run: npx @capacitor/assets generate --android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verificar APK gerado
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Dindin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
